{k:"d",q:"Complete the group chat.",ctx:"<b>Mia:</b> Where are you guys? The class {0} at 6:00 and it’s 5:55!<br><b>Eli:</b> We {1} in the elevator. It isn’t working!<br><b>Mia:</b> What? Why {2} you using the stairs?<br><b>Eli:</b> We {3} to, but we’re on the 20th floor!<br><b>Mia:</b> Haha. The teacher usually {4} late, so don’t worry.<br><b>Eli:</b> Great! We’re going up the stairs now!",b:[["starts","is starting"],["are waiting","wait"],["aren’t","don’t"],["are trying","try"],["arrives","is arriving"]],w:"Schedules and “usually” = Simple. Problems now = Continuous."},
{k:"d",q:"Complete the job interview.",ctx:"<b>Boss:</b> So, Carla, what {0} you do in your free time?<br><b>Carla:</b> I {1} soccer on weekends and I read a lot.<br><b>Boss:</b> Great. And what {2} you reading at the moment?<br><b>Carla:</b> A novel about space. I {3} it very much!<br><b>Boss:</b> Do you speak other languages?<br><b>Carla:</b> Yes, I {4} Spanish and English, and I’m learning French this year.",b:[["do","are"],["play","am playing"],["are","do"],["like","am liking"],["speak","am speaking"]],w:"Free time / languages = Simple. “At the moment” and “this year” = Continuous. like = stative."}];
MIS.forEach(m=>m.items=m.items.concat(EX[m.id]||[]));
MIS.splice(5,0,

{k:"t",q:"Carlos studies on Fridays.",ctx:D1,a:0,w:"Maya says: “You always study on Fridays!”"},

{k:"t",q:"Carlos understands the book.",ctx:D1,a:1,w:"“I don’t understand it.”"},
{k:"t",q:"Maya is cooking.",ctx:D1,a:0,w:"“I’m making pizza.”"},
{q:"Why is Carlos taking notes?",ctx:D1,o:["He doesn’t understand the book.","He is writing to Maya."],a:0,w:"He says: “I don’t understand it, so I’m taking notes.”"},
{q:"What do Carlos’s friends usually do on Fridays?",ctx:D1,o:["They go out.","They study."],a:0,w:"“My friends usually go out.”"},

{k:"o",q:"Build the question.",ws:["Does","your","mother","speak","English?"],a:"Does your mother speak English?",w:"Does + subject + base verb."},

MIS.splice(5,0,{id:"say",ic:"💭",name:"What Would You Say?",d:"Continue the conversation. Choose the best line each time.",items:[
{k:"r",q:"You call tech support. Continue the conversation.",who:"Help desk",n:["Hello, tech support. What’s the problem?","I see. Are you using Wi-Fi right now?","OK. Does it usually work well?","Let’s restart the router. I’m sending you the steps now."],b:[["My laptop isn’t connecting to the internet.","My laptop doesn’t connect right now."],["Yes, I am. I’m using the Wi-Fi.","Yes, I do."],["Yes, it does. It usually works fine.","Yes, it is. It usually works fine."]],x:["A problem now → isn’t + -ing.","Are you…? → Yes, I am.","Does it…? → Yes, it does."],w:"Match the question: Are…? → am/is/are. Do…? → do/does."},
{k:"r",q:"You are at a café. Continue the conversation.",who:"Waiter",n:["Hi! Are you ready to order?","Great choice. Do you want anything to drink?","Sure. Why are you looking at the menu again?","Of course. I’ll be right back!"],b:[["Yes, I am. I want a pizza, please.","Yes, I do. I’m wanting a pizza, please."],["Yes, a lemonade, please.","Yes, I’m wanting a lemonade, please."],["Because I’m not sure about dessert.","Because I don’t sure about dessert."]],x:["Are you ready? → Yes, I am. And want has no -ing.","want is stative → no -ing.","Because I’m not sure = state now (be + not)."],w:"Answer with the same auxiliary as the question."},
{k:"r",q:"A friend calls you. Continue the conversation.",who:"Dan",n:["Hey! What are you doing?","Cool. Do you do that every Saturday?","Nice! Is your sister helping you?","OK, I’m coming over in ten minutes!"],b:[["I’m cleaning the kitchen.","I clean the kitchen now."],["Yes, I do. It’s my routine.","Yes, I am. It’s my routine."],["No, she isn’t. She’s at work.","No, she doesn’t. She’s at work."]],x:["What are you doing? → I’m + -ing.","Do you…? → Yes, I do.","Is she…? → No, she isn’t."],w:"Questions with do/does or am/is/are get matching short answers."},
{k:"r",q:"You meet a new classmate. Continue the conversation.",who:"Lucy",n:["Hi, I’m Lucy. I’m new here. What do you do?","Interesting! Is it difficult?","Are you taking any courses this month?","Great! See you in class!"],b:[["I’m a nurse. I work in a hospital.","I’m working nurse in a hospital."],["Sometimes, but I like it.","Sometimes, but I’m liking it."],["Yes, I’m taking an English course.","Yes, I take an English course now."]],x:["What do you do? = your job.","like is stative → no -ing.","“This month” → I’m taking."],w:"Job = Simple. Temporary plans = Continuous."},
{k:"r",q:"Your mom calls. Continue the conversation.",who:"Mom",n:["Hi sweetie! Where are you? Dinner’s ready.","Why aren’t you answering my calls?","Do you want me to pick you up?","OK, see you soon!"],b:[["I’m on the bus. I’m coming home.","I’m on the bus. I come home."],["My phone isn’t working. The battery is dead.","My phone doesn’t working. The battery dead."],["No, thanks. The bus stops near our house.","No, thanks. The bus is stopping near our house every day."]],x:["Now → I’m coming.","Problem now → isn’t working.","A fact about the bus → Simple."],w:"Now = Continuous. Facts and routines = Simple."},
{ctx:"<b>Friend:</b> Why are you wearing a coat?",q:"What would you say?",o:["Because it’s cold today.","Yes, I am."],a:0,w:"A why-question needs a “Because…” answer."},
{ctx:"<b>Friend:</b> What do you usually do on Sundays?",q:"What would you say?",o:["I usually visit my grandparents.","I’m visiting my grandparents now."],a:0,w:"“Usually” → Simple."},
{ctx:"<b>Friend:</b> Are you busy right now?",q:"What would you say?",o:["Yes, I’m finishing my homework.","Yes, I finish my homework."],a:0,w:"“Right now” → I’m + -ing."}]});
const S={pts:0,stk:0,stars:{},best:0};
const $=id=>document.getElementById(id);
const sh=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function hud(){$("hud").hidden=false;$("pts").textContent=S.pts;$("stk").textContent=S.stk}
function show(v,x){window.scrollTo(0,0);({theory:theory,map:map,done:done})[v](x)}

function theory(){ $("hud").hidden=true; $("app").innerHTML=`
<div class="center"><div style="font-size:3rem">⏳🔄</div><h1>Now or Always?</h1><p class="hint">Present Simple vs Present Continuous · A1+ to A2</p></div>
<div class="card"><h2>Step 1 · Learn the difference</h2>
<div class="duo">
<div class="t s"><h3>Present Simple</h3><p class="big">🔄 Always · habits · facts</p>
<div class="ex">I <span class="hl">work</span> every day.</div>
<div class="ex">She <span class="hl">lives</span> in Cali.</div>
<div class="ex">Water <span class="hl">boils</span> at 100°C.</div>
<p class="hint">Words: always, usually, often, sometimes, never, every day, on Mondays</p></div>
<div class="t c"><h3>Present Continuous</h3><p class="big">📍 Now · happening · temporary</p>
<div class="ex">I <span class="hl">am working</span> now.</div>
<div class="ex">She <span class="hl">is talking</span> on the phone.</div>
<div class="ex">It <span class="hl">is raining</span>. Look!</div>
<p class="hint">Words: now, right now, at the moment, today, Look!, Listen!, Wait!</p></div></div></div>
<div class="card"><h2>Step 2 · Make the sentences</h2><div class="scroll"><table>
<tr><th></th><th style="color:var(--s)">Present Simple</th><th style="color:var(--c)">Present Continuous</th></tr>
<tr><td>＋</td><td>I/you/we/they <b>play</b><br>he/she/it <b>plays</b></td><td>I <b>am</b> playing<br>he/she/it <b>is</b> playing<br>you/we/they <b>are</b> playing</td></tr>
<tr><td>－</td><td>I <b>don’t</b> play<br>she <b>doesn’t</b> play</td><td>I’m <b>not</b> playing<br>she <b>isn’t</b> playing<br>they <b>aren’t</b> playing</td></tr>
<tr><td>？</td><td><b>Do</b> you play?<br><b>Does</b> she play?</td><td><b>Am</b> I playing?<br><b>Is</b> she playing?<br><b>Are</b> they playing?</td></tr></table></div>
<p class="hint">Spelling: he play<b>s</b> · she watch<b>es</b> · he stud<b>ies</b> · run → run<b>ning</b> · make → mak<b>ing</b></p></div>
<div class="card"><h2>Step 3 · Ask questions</h2><div class="scroll"><table>
<tr><th style="color:var(--s)">Present Simple</th><th style="color:var(--c)">Present Continuous</th></tr>
<tr><td>What <b>do</b> you do?</td><td>What <b>are</b> you doing?</td></tr>
<tr><td>Where <b>does</b> she work?</td><td>Where <b>is</b> she working today?</td></tr>
<tr><td>How often <b>do</b> they study?</td><td>Why <b>are</b> they laughing?</td></tr>
<tr><td>Yes, I <b>do</b>. / No, he <b>doesn’t</b>.</td><td>Yes, I <b>am</b>. / No, it <b>isn’t</b>.</td></tr></table></div></div>
<div class="card"><h2>Step 4 · Quick tricks</h2>
<div class="ex">❓ Does it happen <b>again and again</b>? → Present Simple</div>
<div class="ex">❓ Can you <b>see or hear it now</b>? → Present Continuous</div>
<div class="ex">⚠️ Some verbs don’t use -ing: <b>like, love, want, need, know</b>. Say “I <b>want</b> water”, not “I’m wanting”.</div></div>
<div class="center"><button class="btn" onclick="show('map')">Start the game 🎮</button></div>`}

function stars(id){const n=S.stars[id];return n==null?"":"★".repeat(n)+"☆".repeat(3-n)}
function map(){ hud(); const all=MIS.every(m=>S.stars[m.id]!=null);
$("app").innerHTML=`<h1>Choose a mission</h1><p class="hint">Earn 10 points for each correct answer. Build a streak for bonus points!</p>
<div class="map">${MIS.map(m=>`<button class="mis" onclick="play('${m.id}')"><span class="ic">${m.ic}</span><span><b>${m.name}</b><small>${m.d}</small></span><span class="stars">${stars(m.id)}</span></button>`).join("")}</div>
<div class="center" style="margin-top:14px">${all?`<button class="btn" onclick="show('done')">See my badge 🏆</button> `:""}<button class="btn ghost" onclick="show('theory')">📖 Review the theory</button></div>`}

const nz=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g," ").trim();
let M,I,ok,items,sel,ch,cw;
function play(id){M=MIS.find(m=>m.id==id);I=0;ok=0;items=M.keep?M.items:sh(M.items).map(it=>({...it,ord:it.o?sh(it.o.map((t,i)=>[t,i])):it.ws?sh(it.ws):null}));step()}
function step(){hud();const it=items[I],k=it.k||"c",p=Math.round(I/items.length*100);sel=[];ch=0;cw=0;
let h=`<div class="card"><b>${M.ic} ${M.name}</b> · ${I+1}/${items.length}<div class="bar"><i style="width:${p}%"></i></div>`;
if(it.s)h+=`<div class="scene">${it.s}</div>`;
if(it.ctx)h+=`<div class="chat">${it.ctx}</div>`;
if(k=="p")h+=`<div class="q">${it.q}</div><p class="hint">Do it out loud with a partner. Be honest!</p><button class="btn" onclick="spk()">I did it! +15</button> <button class="btn ghost" onclick="nxt()">Skip</button></div>`;
else if(k=="s"||k=="t")h+=`<div class="q">“${it.q}”</div><div class="split"><button class="opt s-btn" onclick="ans(0,this)">${k=="t"?"✅ True":"🔄 Always<br><small>Present Simple</small>"}</button><button class="opt c-btn" onclick="ans(1,this)">${k=="t"?"❌ False":"📍 Now<br><small>Present Continuous</small>"}</button></div><div id="fb"></div></div>`;
else if(k=="r")h+=`<div class="q">${it.q}</div><div class="chat" id="tr"></div><div id="ro"></div><div id="fb"></div></div>`;
else if(k=="d")h+=`<div class="q">${it.q}</div><div class="chat">${it.ctx.replace(/\{(\d)\}/g,(m,n)=>`<select class="sel" id="d${n}"><option value="">…</option>${sh(it.b[n].map((t,i)=>[t,i])).map(([t,i])=>`<option value="${i}">${t}</option>`).join("")}</select>`)}</div><p><button class="btn" id="ck" onclick="chk()">Check</button></p><div id="fb"></div></div>`;
else if(k=="f")h+=`<div class="q">${it.q}</div><input id="in" class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" onkeydown="if(event.key=='Enter')chk()"><p><button class="btn" id="ck" onclick="chk()">Check</button></p><div id="fb"></div></div>`;
else if(k=="o")h+=`<div class="q">${it.q} <span class="hint">Tap the words in order.</span></div><div class="slot" id="slot"></div>${it.ord.map((t,j)=>`<button class="opt wb" onclick="pick(${j},this)">${t}</button>`).join("")}<p><button class="btn" id="ck" onclick="chk()">Check</button> <button class="btn ghost" onclick="step()">Reset</button></p><div id="fb"></div></div>`;
else h+=`<div class="q">${it.q}</div>`+it.ord.map(([t,i])=>`<button class="opt" data-i="${i}" onclick="ans(${i},this)">${t}</button>`).join("")+`<div id="fb"></div></div>`;
$("app").innerHTML=h;const f=$("in");if(f)f.focus();if(k=="r")rr()}
function pick(j,b){sel.push(items[I].ord[j]);b.disabled=true;$("slot").textContent=sel.join(" ")}
function rr(){const it=items[I];let t="";for(let j=0;j<=ch&&j<it.n.length;j++){t+=`<b>${it.who}:</b> ${it.n[j]}<br>`;if(j<ch)t+=`<b>You:</b> ${it.b[j][0]}<br>`}
$("tr").innerHTML=t;$("ro").innerHTML=ch<it.b.length?`<p class="hint">What would you say?</p>`+sh(it.b[ch].map((x,i)=>[x,i])).map(([x,i])=>`<button class="opt" onclick="rp(${i},this)">${x}</button>`).join(""):""}
function rp(i,b){const it=items[I];document.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add(i?"bad":"ok");if(i)cw++;else S.pts+=5;hud();
$("fb").innerHTML=`<div class="fb ${i?"bad":"ok"}">${i?"❌ Better: <b>"+it.b[ch][0]+"</b>":"✅ Good reply!"} ${it.x[ch]}</div><p><button class="btn" onclick="rc()">Continue</button></p>`}
function rc(){const it=items[I];ch++;$("fb").innerHTML="";rr();if(ch<it.b.length)return;const g=!cw;if(g){ok++;S.stk++;S.best=Math.max(S.best,S.stk)}else S.stk=0;hud();
$("ro").innerHTML=`<div class="fb ${g?"ok":"bad"}">${g?"🎉 Perfect conversation!":"Nice try — "+cw+" reply to improve."} ${it.w}</div><p><button class="btn" onclick="nxt()">${I+1<items.length?"Next":"Finish"}</button></p>`}
function res(g){const it=items[I],k=it.k||"c";if(g){ok++;S.stk++;S.best=Math.max(S.best,S.stk);S.pts+=(it.b?it.b.length*5:10)+(S.stk>=3?5:0)}else S.stk=0;hud();
const rv=!g&&k=="f"?`<br>Answer: <b>${it.t[0]}</b>`:!g&&k=="d"?`<br>Answers: <b>${it.b.map(x=>x[0]).join(" · ")}</b>`:!g&&k=="o"?`<br>Answer: <b>${it.a}</b>`:"";
$("fb").innerHTML=`<div class="fb ${g?"ok":"bad"}">${g?"✅ Great!"+(S.stk>=3?" 🔥 Streak bonus +5!":""):"❌ Not this time."} ${it.w}${rv}</div><p><button class="btn" onclick="nxt()">${I+1<items.length?"Next":"Finish"}</button></p>`}
function ans(i,b){const it=items[I],g=i==it.a,all=[...document.querySelectorAll(".opt")];all.forEach(x=>x.disabled=true);
(it.k=="s"||it.k=="t"?all[it.a]:all.find(x=>+x.dataset.i==it.a)).classList.add("ok");if(!g)b.classList.add("bad");res(g)}
function chk(){const it=items[I];let g;if(it.k=="d"){const v=it.b.map((_,n)=>$("d"+n).value);if(v.includes(""))return;g=v.every(x=>x=="0");document.querySelectorAll(".sel").forEach((e,n)=>{e.disabled=true;e.style.borderColor=v[n]=="0"?"var(--ok)":"var(--bad)"})}else if(it.k=="f"){const v=nz($("in").value);if(!v)return;g=it.t.some(x=>nz(x)==v);$("in").disabled=true}else{if(!sel.length)return;g=nz(sel.join(" "))==nz(it.a);document.querySelectorAll(".wb").forEach(b=>b.disabled=true)}
$("ck").disabled=true;res(g)}
function spk(){S.pts+=15;ok++;nxt()}
function nxt(){I++;I<items.length?step():fin()}
function fin(){const r=ok/items.length,n=r>=.85?3:r>=.6?2:r>=.3?1:0;S.stars[M.id]=Math.max(S.stars[M.id]||0,n);hud();
$("app").innerHTML=`<div class="card center"><div style="font-size:3rem">${n==3?"🏆":n?"👏":"💪"}</div><h2>${M.name} complete!</h2><div style="font-size:2rem">${"★".repeat(n)+"☆".repeat(3-n)}</div><p>${ok} / ${items.length} correct · Total: <b>${S.pts}</b> points</p><button class="btn" onclick="play('${M.id}')">Play again</button> <button class="btn ghost" onclick="show('map')">Back to missions</button></div>`}
function done(){const t=S.pts,lv=t>=750?["🏆","Grammar Champion"]:t>=450?["🥈","Tense Master"]:["🥉","Tense Explorer"];
$("app").innerHTML=`<div class="card center"><div style="font-size:4rem">${lv[0]}</div><h1>${lv[1]}</h1><p>You finished all missions with <b>${t}</b> points.<br>Best streak: <b>${S.best}</b> 🔥</p><p class="hint">Challenge: can you beat your score?</p><button class="btn" onclick="show('map')">Keep playing</button></div>`}
theory();
</script>
</body>
</html>
